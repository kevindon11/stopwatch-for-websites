<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab limit reached</title>
    <link rel="stylesheet" href="tab-limit.css" />
  </head>
  <body>
    <main class="panel">
      <div class="limit-icon" aria-hidden="true">!</div>
      <p class="eyebrow">Site Stopwatch</p>
      <h1>You’ve reached your tab limit</h1>
      <p class="intro">Please close another tab to continue to this site.</p>
      <p id="site" class="site"></p>

      <section aria-labelledby="open-tabs-heading">
        <div class="section-heading">
          <h2 id="open-tabs-heading">Open tabs for this site</h2>
          <span id="count" class="count"></span>
        </div>
        <div id="tabs" class="tabs" aria-live="polite"></div>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>
    <script src="tab-limit.js"></script>
  </body>
</html>
